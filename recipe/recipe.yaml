schema_version: 1

context:
  version: "6.11.0"
  sip_version: "6.15.3"
  pyqt6_sip_version: "13.13.0"
  webengine_version: "6.11.0"
  charts_version: "6.8.0"
  pyqt_builder_version: "1.18.2"

recipe:
  name: pyqt6-split
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/P/PyQt${{ version[0] }}/pyqt${{ version[0] }}-${{ version }}.tar.gz
    sha256: 45dd60aa69976de1918b5ced6b4e7b6a25abd2a919ecef5fd5826ecc76718889
    target_directory: pyqt
  - url: https://pypi.org/packages/source/P/PyQt6-sip/pyqt6_sip-${{ pyqt6_sip_version }}.tar.gz
    sha256: 2cd55f575cde208c398d6cfdecc5a13394ed2afb54226210c50e3a6df7c3a997
    target_directory: pyqt_sip
  - url: https://pypi.org/packages/source/P/PyQt6-WebEngine/pyqt6_webengine-${{ webengine_version }}.tar.gz
    sha256: 15cf49efbbbd4c6bc87653b2c4ae80d6049f800e31620b336734ae2e37cbedae
    target_directory: pyqt_webengine
  - url: https://pypi.org/packages/source/P/PyQt6-Charts/PyQt6_Charts-${{ charts_version }}.tar.gz
    sha256: f86705b8740e3041667ce211aeaa205b750eb6baf4c908f4e3f6dc8c720d10f1
    target_directory: pyqt_charts

build:
  number: 5
  skip:
    - linux and ppc64le

outputs:
  - package:
      name: pyqt6-sip
      version: ${{ pyqt6_sip_version }}
    build:
      script:
        file: ${{ 'bld-pyqt-sip.bat' if win else 'build-pyqt-sip.sh' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
      host:
        - python
        - setuptools
        - wheel
        - pip
      run:
        - python
        - sip
        - packaging
        - toml
    tests:
      - python:
          imports:
            - PyQt6.sip
          pip_check: false
  - package:
      name: pyqt6
      version: ${{ version }}
    build:
      script:
        file: ${{ 'bld-pyqt.bat' if win else 'build-pyqt.sh' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - if: win
          then: jom
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - pyqt-builder ${{ pyqt_builder_version }}.*
            - sip ${{ sip_version }}.*
            - qt6-main ${{ version }}.*
            - qt6-multimedia ${{ version }}.*
            - qt6-serialport ${{ version }}.*
            - qt6-positioning ${{ version }}.*
        - make
        - if: linux
          then:
            - patchelf
            - libsystemd
      host:
        - python
        - pip
        - setuptools
        - if: build_platform == target_platform
          then:
            - sip ${{ sip_version }}.*
            - pyqt-builder ${{ pyqt_builder_version }}.*
        - toml
        - packaging
        - qt6-main ${{ version }}.*
        - qt6-multimedia ${{ version }}.*
        - qt6-serialport ${{ version }}.*
        - qt6-positioning ${{ version }}.*
        - if: linux
          then:
            - libsystemd
            - libgl-devel
            - libegl-devel
            - libopengl-devel
            - xorg-xorgproto
            - xcb-util
            - xcb-util-wm
            - xcb-util-keysyms
            - xcb-util-image
            - xcb-util-renderutil
            - xorg-libx11
            - xorg-libxext
            - xorg-libxdamage
            - xorg-libsm
            - xorg-libice
            - xorg-libxcomposite
            - xorg-libxxf86vm
            - xorg-xf86vidmodeproto
      run:
        - python
        - ${{ pin_subpackage('pyqt6-sip', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('pyqt6', upper_bound='x.x') }}
    tests:
      - python:
          imports:
            - PyQt6
            - PyQt6.sip
            - PyQt6.QtCore
            - PyQt6.QtGui
            - PyQt6.QtHelp
            - PyQt6.QtNetwork
            - PyQt6.QtOpenGL
            - PyQt6.QtPrintSupport
            - PyQt6.QtQml
            - PyQt6.QtQuick
            - PyQt6.QtQuickWidgets
            - PyQt6.QtSvg
            - PyQt6.QtSvgWidgets
            - PyQt6.QtTest
            - PyQt6.QtWebChannel
            - PyQt6.QtWebSockets
            - PyQt6.QtWidgets
            - PyQt6.QtXml
            - PyQt6.QtMultimedia
            - PyQt6.QtSerialPort
            - PyQt6.QtPositioning
          pip_check: false
      - files:
          recipe:
            - pyqt_test.py
            - test_plugin_load.py
        script:
          - if: linux and build_platform == target_platform
            then: QT_QPA_PLATFORM=offscreen python pyqt_test.py
          - if: not win
            then: pyuic6 --version
          - if: unix
            then: test -f "${PREFIX}/lib/qt6/plugins/designer/libpyqt6${SHLIB_EXT}"
          - if: win
            then: if not exist "%PREFIX%\\Library\\plugins\\designer\\libpyqt6.dll" exit 1
          - python test_plugin_load.py
  - package:
      name: pyqt6webengine
      version: ${{ version }}
    build:
      # qt6-webengine isn't built for osx-64
      skip: osx and x86_64
      script:
        file: ${{ 'bld-pyqtwebengine.bat' if win else 'build-pyqtwebengine.sh' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - if: win
          then: jom
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - pyqt-builder ${{ pyqt_builder_version }}.*
            - sip ${{ sip_version }}.*
            - qt6-main ${{ version }}.*
        - make
      host:
        - python
        - pip
        - setuptools
        - if: build_platform == target_platform
          then:
            - sip ${{ sip_version }}.*
            - pyqt-builder ${{ pyqt_builder_version }}.*
        - toml
        - packaging
        - pyqt6
        - qt6-main ${{ version }}.*
        - qt6-webengine ${{ version }}.*
        - if: linux
          then:
            - libgl-devel
            - libegl-devel
            - libopengl-devel
            - xorg-xorgproto
            - xcb-util
            - xcb-util-wm
            - xcb-util-keysyms
            - xcb-util-image
            - xcb-util-renderutil
            - xorg-libx11
            - xorg-libxext
            - xorg-libxdamage
            - xorg-libsm
            - xorg-libice
            - xorg-libxcomposite
            - xorg-libxxf86vm
            - xorg-xf86vidmodeproto
      run:
        - python
        - ${{ pin_subpackage('pyqt6', upper_bound='x.x') }}
      run_exports:
        - ${{ pin_subpackage('pyqt6webengine', upper_bound='x.x') }}
    tests:
      - python:
          imports:
            - PyQt6.QtWebEngineCore
            - PyQt6.QtWebEngineQuick
            - PyQt6.QtWebEngineWidgets
          pip_check: false
  - package:
      name: pyqt6-charts
      version: ${{ version }}
    build:
      script:
        file: ${{ 'bld-pyqtcharts.bat' if win else 'build-pyqtcharts.sh' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - if: win
          then: jom
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - pyqt-builder ${{ pyqt_builder_version }}.*
            - sip ${{ sip_version }}.*
            - qt6-main ${{ version }}.*
            - qt6-charts ${{ version }}.*
        - make
      host:
        - python
        - pip
        - setuptools
        - if: build_platform == target_platform
          then:
            - sip ${{ sip_version }}.*
            - pyqt-builder ${{ pyqt_builder_version }}.*
        - toml
        - packaging
        - qt6-main ${{ version }}.*
        - qt6-charts ${{ version }}.*
        - pyqt6
        - if: linux
          then:
            - libgl-devel
            - libegl-devel
            - libopengl-devel
            - xorg-xorgproto
            - xcb-util
            - xcb-util-wm
            - xcb-util-keysyms
            - xcb-util-image
            - xcb-util-renderutil
            - xorg-libx11
            - xorg-libxext
            - xorg-libxdamage
            - xorg-libsm
            - xorg-libice
            - xorg-libxcomposite
            - xorg-libxxf86vm
            - xorg-xf86vidmodeproto
      run:
        - python
        - ${{ pin_subpackage('pyqt6', upper_bound='x.x') }}
      run_exports:
        - ${{ pin_subpackage('pyqt6-charts', upper_bound='x.x') }}
    tests:
      - python:
          imports:
            - PyQt6.QtCharts
          pip_check: false

about:
  license: GPL-3.0-only
  license_file: pyqt/LICENSE
  summary: Python bindings for the Qt cross platform application toolkit
  # The remaining entries in this section are optional, but recommended.
  description: |
    PyQt6 is a comprehensive set of Python bindings for Qt v6.
    It is implemented as more than 35 extension modules and enables Python
    to be used as an alternative application development language to C++ on
    all supported platforms including iOS and Android.
  homepage: https://www.riverbankcomputing.com/software/pyqt/
  repository: https://www.riverbankcomputing.com/mailman/listinfo/pyqt/
  documentation: https://www.riverbankcomputing.com/static/Docs/PyQt6/

extra:
  recipe-maintainers:
    - andfoy
    - ccordoba12
    - mingwandroid
    - gillins
    - msarahan
    - ocefpaf
    - jschueller
    - pb01ka
  feedstock-name: pyqt

